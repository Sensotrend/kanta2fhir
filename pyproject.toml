[project]
name = "kanta2fhir"
version = "0.1.0"
description = "Convert Kanta ndjson exports (DocumentReference + CDA R2) into European FHIR documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.3",
]

[project.scripts]
kanta2fhir = "kanta2fhir.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kanta2fhir"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tools/make_synthetic_inpatient.py" = ["E501"]  # CDA XML templates

[tool.pytest.ini_options]
testpaths = ["tests"]
